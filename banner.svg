<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="f1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0100"/>
      <stop offset="50%" stop-color="#1c0800"/>
      <stop offset="100%" stop-color="#0d0000"/>
    </linearGradient>
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softFireGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgFire)"/>

  <!-- Orb 1: crimson -->
  <ellipse cx="150" cy="80" rx="190" ry="145" fill="url(#f1)">
    <animate attributeName="cx" values="150;330;190;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;115;65;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.6;0.85" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orb 2: orange -->
  <ellipse cx="760" cy="130" rx="200" ry="155" fill="url(#f2)">
    <animate attributeName="cx" values="760;610;790;760" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;95;155;130" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.95;0.55;0.75" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orb 3: amber/gold -->
  <ellipse cx="450" cy="195" rx="165" ry="105" fill="url(#f3)">
    <animate attributeName="cx" values="450;375;525;450" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="195;165;205;195" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.85;0.45;0.65" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orb 4: deep red -->
  <ellipse cx="830" cy="35" rx="135" ry="105" fill="url(#f4)">
    <animate attributeName="cx" values="830;710;860;830" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="35;75;25;35" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.5;0.95;0.75" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ember particles -->
  <circle cx="75" cy="38" r="2.5" fill="#ff6b35" opacity="0.95">
    <animate attributeName="cy" values="38;18;38" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.95;0.2;0.95" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="155" r="2" fill="#fb923c" opacity="0.85">
    <animate attributeName="cy" values="155;132;155" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="385" cy="28" r="3" fill="#fbbf24" opacity="0.9">
    <animate attributeName="cy" values="28;10;28" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="48" r="2" fill="#f97316" opacity="0.9">
    <animate attributeName="cy" values="48;30;48" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="715" cy="168" r="2.5" fill="#ef4444" opacity="0.75">
    <animate attributeName="cy" values="168;145;168" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.15;0.75" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="98" r="2" fill="#fb923c" opacity="0.85">
    <animate attributeName="cx" values="855;843;855" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="295" cy="198" r="2" fill="#fbbf24" opacity="0.7">
    <animate attributeName="cy" values="198;180;198" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="525" cy="192" r="3" fill="#ff4500" opacity="0.65">
    <animate attributeName="cy" values="192;170;192" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.15;0.65" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Wave bottom -->
  <path d="M0,185 C150,155 300,215 450,185 C600,155 750,210 900,185 L900,220 L0,220 Z" fill="#0d0000" opacity="0.92"/>
  <path d="M0,200 C200,175 400,215 600,195 C750,180 850,210 900,200 L900,220 L0,220 Z" fill="#0d0000"/>

  <!-- ✏️ EDIT YOUR NAME BELOW -->
  <text x="450" y="103" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="52" font-weight="800"
    fill="white" filter="url(#fireGlow)" letter-spacing="1">
    Your Name Here
    <animate attributeName="opacity" values="0;1;1" dur="1.5s" repeatCount="1" fill="freeze"/>
  </text>

  <!-- ✏️ EDIT YOUR ROLE/TAGLINE BELOW -->
  <text x="450" y="145" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="18" font-weight="400"
    fill="#fb923c" filter="url(#softFireGlow)" letter-spacing="1">
    Your Role  |  Your Tagline
    <animate attributeName="opacity" values="0;0;1" dur="2s" repeatCount="1" fill="freeze"/>
  </text>
</svg>
